[package]
name = "bump_arena"
version = "0.1.0"
description = "BUMP.TRADE staked arena escrow"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "bump_arena"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.0.1"
anchor-spl = "=1.0.1"

[dev-dependencies]
litesvm = "0.9.1"
solana-keypair = "3"
solana-signer = "3"
solana-pubkey = "3"
solana-transaction = "3"
solana-message = "3"
solana-instruction = "3"
solana-account = "3"
solana-clock = "3"
rand = "0.8"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
